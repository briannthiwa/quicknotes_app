<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts instantly, organize your day effortlessly</p>
    </header>

    <main>
        <!-- Section 1: Add a Note -->
        <section class="app-card">
            <h2>Add a Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <!-- Section 2: Your Notes Display -->
        <section class="app-card">
            <h2>Your Notes</h2>
            
            <div class="search-container">
                <label for="search-input" class="visually-hidden">Search notes</label>
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>

            <div class="status-bar">
                <p id="note-count">You have no notes yet.</p>
                <!-- Bonus Button included -->
                <button id="clear-all-btn" class="danger-btn">Clear All</button>
            </div>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App. Built for productivity.</p>
    </footer>

</body>
</html>
